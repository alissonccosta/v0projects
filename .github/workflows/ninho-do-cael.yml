name: Ninho do Cael CI

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "ninho-do-cael/**"
      - ".github/workflows/ninho-do-cael.yml"
  pull_request:
    paths:
      - "ninho-do-cael/**"
      - ".github/workflows/ninho-do-cael.yml"

defaults:
  run:
    working-directory: ninho-do-cael

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ninho-do-cael/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format:check
      - name: Tipos
        run: npm run typecheck
      - name: Testes unitários
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ninho-do-cael/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes E2E
        run: npm run e2e
      - name: Publicar relatório em caso de falha
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ninho-do-cael/playwright-report
          retention-days: 7
